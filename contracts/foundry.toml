[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Yul IR pipeline — needed because the test mocks have functions with
# many parameters (e.g. ERC-8004's giveFeedback takes 8 args, four of
# which are strings) that exceed the EVM's 16-slot stack limit under
# the legacy codegen. via_ir + optimizer also gives slightly better
# runtime gas for JobEscrow itself.
via_ir = true
optimizer = true
optimizer_runs = 200

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
